name: release

# 预编译 CPU 二进制。触发：推 tag v* 自动发 Release；workflow_dispatch 手动（仅构建 + artifact）。
#
# 两平台都是 pyke 静态链接 ORT 核心 → 单文件自包含二进制（无需外带任何 DLL/.so）。
# CPU 构建不启用 copy-dylibs（provider 插件 DLL 运行时按需加载，CPU 推理不需要），
# 也因此避开了 ort-sys copy_dylibs 在 Windows runner 上的 panic。
#
# 范围：x86_64 CPU。aarch64（Jetson）/ GPU 后端不在此流水线（需目标机按 docs/deploy.md 源码构建）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: yolo-rust
            archive: yolo-rust-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: yolo-rust.exe
            archive: yolo-rust-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (openssl for ort tls-native)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build (release, CPU, self-contained)
        run: cargo build --release --locked

      - name: Package Linux (single binary → tar.gz)
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.archive }} -C target/release ${{ matrix.bin }}

      - name: Package Windows (single exe → zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/${{ matrix.bin }} -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/yolo-rust-linux-x64.tar.gz/yolo-rust-linux-x64.tar.gz
            dist/yolo-rust-windows-x64.zip/yolo-rust-windows-x64.zip
