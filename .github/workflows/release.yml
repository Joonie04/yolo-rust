name: release

# 预编译 CPU 二进制。触发：推 tag v* 自动发 Release；workflow_dispatch 手动（仅构建 + artifact）。
#
# 平台差异：
#   - Linux   ：ubuntu-24.04（glibc 2.39）上 pyke 静态链接 ORT 核心，单文件自包含。
#               限制：pyke 静态 ORT 用 GCC 13 + glibc 2.38 编译，二进制需 glibc 2.39+（Ubuntu 24.04+）。
#               官方 ORT 1.28.0 无 GitHub/PyPI 发布（只有 pyke 静态构建），故无法做 manylinux 便携版。
#               Ubuntu 22.04 请用 docs/deploy.md 的 deploy/assemble.sh 从源码构建。
#   - Windows ：pyke 静态链接 ORT 核心，单文件自包含（MSVC 自带运行时，无 glibc 问题）。
#
# 范围：x86_64 CPU。aarch64（Jetson）/ GPU 后端不在此流水线。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: build (linux x64, glibc 2.39+)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Linux system deps (openssl for ort tls-native)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build (release, CPU, self-contained)
        run: cargo build --release --locked

      - name: Package (single binary → tar.gz)
        run: tar czf yolo-rust-linux-x64.tar.gz -C target/release yolo-rust

      - uses: actions/upload-artifact@v4
        with:
          name: yolo-rust-linux-x64.tar.gz
          path: yolo-rust-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: build (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build (release, CPU, self-contained)
        run: cargo build --release --locked

      - name: Package (single exe → zip)
        shell: pwsh
        run: Compress-Archive -Path target/release/yolo-rust.exe -DestinationPath yolo-rust-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: yolo-rust-windows-x64.zip
          path: yolo-rust-windows-x64.zip
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/yolo-rust-linux-x64.tar.gz/yolo-rust-linux-x64.tar.gz
            dist/yolo-rust-windows-x64.zip/yolo-rust-windows-x64.zip

  docker:
    name: build & push Docker image (GHCR)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/joonie04/yolo-rust:latest
            ghcr.io/joonie04/yolo-rust:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
