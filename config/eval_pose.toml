# 精度评估示例（pose，COCO 关键点 → OKS mAP + PCK@0.5）。
# 用法: cargo run -- eval config/eval_pose.toml
# 输出: results/eval_report.json
#
# 本示例用 utils/make_synthetic_pose_coco.py 生成的合成 COCO 集（真值 == 模型自身关键点），
# 跑通应得 mAP@0.5 = mAP@0.5:0.95 = pck50 = 1.0，用于端到端冒烟验证 OKS 链路。
#
# 真实 COCO 等价性评估（对标 Ultralytics `model.val()`）时，把 conf 改为 0.001、
# 并把 dataset 指向你的 COCO 图片目录与 person_keypoints_val2017.json。

[model]
path = "models/pose/yolo26n-pose.onnx"

[dataset]
images = "data/eval/images"
annotations = "data/eval/annotations_pose.json"

[inference]
device = "cpu"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true

[eval]
dir = "results"
