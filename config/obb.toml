# 旋转目标框（OBB）示例
# 用法: cargo run -- config/obb.toml

[model]
path = "models/obb/yolo26n-obb.onnx"

[source]
type = "image"
path = "data/boats.jpg"

[inference]
device = "cpu"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true

[output]
save_annotated = true
save_json = true
dir = "results"

[logging]
verbose = true
