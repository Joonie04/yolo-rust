# 旋转目标框（OBB）示例（CUDA fp32），用于服务器全任务冒烟验证。
# 用法: cargo run --release --features cuda -- config/obb_cuda.toml

[model]
path = "models/obb/yolo26n-obb.onnx"

[source]
type = "image"
path = "data/boats.jpg"

[inference]
device = "cuda:0"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true

[output]
save_annotated = false
save_json = true
dir = "results/obb_cuda"

[logging]
verbose = false
