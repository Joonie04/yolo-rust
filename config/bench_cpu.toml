# 工程基准（CPU 基线，用于阶段 5 跨设备对比）。
# 用法: cargo run -- bench config/bench_cpu.toml
# 输出: results/bench_report.json（与 bench_cuda*.toml 用同一份 data/bench 输入集，可比）

[model]
path = "models/det/yolo26n.onnx"

[source]
type = "directory"
path = "data/bench"

[inference]
device = "cpu"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true

[bench]
warmup = 3
iterations = 20
dir = "results/bench_cpu"
