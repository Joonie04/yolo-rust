# 精度评估示例（obb，DOTA 标注 → 旋转 IoU mAP）。
# 用法: cargo run -- eval config/eval_obb.toml
# 输出: results/eval_report.json
#
# 本示例用 `cargo run --example make_obb_gt` 生成的合成 DOTA 标签（真值 == 模型自身旋转框角点），
# 跑通应得 mAP@0.5 = mAP@0.5:0.95 = 1.0，用于端到端冒烟验证 obb 评估链路。
#
# dataset.annotations 为 COCO 同构 JSON，但 annotations[].poly 是 4 个角点的 8 个坐标。

[model]
path = "models/obb/yolo26n-obb.onnx"

[dataset]
images = "data/eval/images"
annotations = "data/eval/obb_labels.json"

[inference]
device = "cpu"
threads = 0
conf = 0.25
iou = 0.7
max_det = 300
rect = true

[eval]
dir = "results"
