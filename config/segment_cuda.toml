# 实例分割示例（CUDA fp32），用于服务器全任务冒烟验证。
# 用法: cargo run --release --features cuda -- config/segment_cuda.toml

[model]
path = "models/seg/yolo26n-seg.onnx"

[source]
type = "image"
path = "data/bus.jpg"

[inference]
device = "cuda:0"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true

[output]
save_annotated = false
save_json = true
dir = "results/segment_cuda"

[logging]
verbose = false
