# 目标检测示例
# 用法: cargo run -- config/detect.toml

[model]
path = "models/det/yolo26n.onnx"

[source]
type = "image"
path = "data/bus.jpg"

[inference]
device = "cpu"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true

[output]
save_annotated = true
save_json = true
dir = "results"

[logging]
verbose = true
