# 等价性验证：与 Ultralytics Python 对齐的 detect 推理参数。
# 用法: cargo run --release -- config/equiv_detect.toml
# 对齐参数（与 utils/dump_detections.py 一致）：conf=0.001 / iou=0.7 / max_det=300 / rect=false。

[model]
path = "models/det/yolo26n.onnx"

[source]
type = "directory"
path = "data/equiv/images"

[inference]
device = "cpu"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = false

[output]
save_annotated = false
save_json = true
dir = "results/equiv"

[logging]
verbose = false
