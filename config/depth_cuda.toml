# 深度估计示例（CUDA fp32，yolo26 独有任务），用于服务器全任务冒烟验证。
# 用法: cargo run --release --features cuda -- config/depth_cuda.toml

[model]
path = "models/depth/yolo26m-depth.onnx"

[source]
type = "image"
path = "data/depth/kids.jpg"

[inference]
device = "cuda:0"
threads = 0

[output]
save_annotated = false
save_json = true
dir = "results/depth_cuda"

[logging]
verbose = false
