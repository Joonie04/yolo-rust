# 语义分割示例（CUDA fp32，yolo26 独有任务），用于服务器全任务冒烟验证。
# 用法: cargo run --release --features cuda -- config/semantic_cuda.toml

[model]
path = "models/sem/yolo26n-sem.onnx"

[source]
type = "image"
path = "data/bus.jpg"

[inference]
device = "cuda:0"
threads = 0

[output]
save_annotated = false
save_json = true
dir = "results/semantic_cuda"

[logging]
verbose = false
