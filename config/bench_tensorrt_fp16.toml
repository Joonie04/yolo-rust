# 工程基准（TensorRT FP16，batch=1）。
# 用法: cargo run --release --features "cuda tensorrt" -- bench config/bench_tensorrt_fp16.toml
# 输出: results/bench_report.json（与 bench_tensorrt.toml 对比量化加速比）
# 注意: 首次运行会构建 FP16 引擎（缓存在 .trt_cache/<stem>_fp16/）。

[model]
path = "models/det/yolo26n.onnx"

[source]
type = "directory"
path = "data/bench"

[inference]
device = "tensorrt:0"
conf = 0.25
iou = 0.7
max_det = 300
threads = 0
rect = true
quantize = "fp16"

[bench]
warmup = 3
iterations = 20
dir = "results/bench_tensorrt_fp16"
